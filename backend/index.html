<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Tracker</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        #output-log {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bank Account Log</h1>
    <p>Check the developer console or read the log below to see the operations output.</p>
    <div id="output-log"></div>
</div>

<script>
    // JavaScript Logic

    class BankAccount {
        constructor() {
            this.balance = 0;
            this.transactions = [];
        }

        deposit(amount) {
            if (amount <= 0) {
                return "Deposit amount must be greater than zero.";
            }

            this.balance += amount;
            this.transactions.push({ type: "deposit", amount: amount });

            return `Successfully deposited $${amount}. New balance: $${this.balance}`;
        }

        withdraw(amount) {
            if (amount <= 0 || amount > this.balance) {
                return "Insufficient balance or invalid amount.";
            }

            this.balance -= amount;
            this.transactions.push({ type: "withdraw", amount: amount });

            return `Successfully withdrew $${amount}. New balance: $${this.balance}`;
        }

        checkBalance() {
            return `Current balance: $${this.balance}`;
        }

        listAllDeposits() {
            const deposits = this.transactions
                .filter(transaction => transaction.type === 'deposit')
                .map(transaction => transaction.amount)
                .join(',');

            return `Deposits: ${deposits}`;
        }

        listAllWithdrawals() {
            const withdrawals = this.transactions
                .filter(transaction => transaction.type === 'withdraw')
                .map(transaction => transaction.amount)
                .join(',');

            return `Withdrawals: ${withdrawals}`;
        }
    }

    // --- Instantiate myAccount and run operations ---

    const myAccount = new BankAccount();
    const outputLog = document.getElementById('output-log');

    // Helper function to write to the HTML log for visual confirmation
    function logOutput(message) {
        outputLog.innerHTML += message + '\n';
        console.log(message);
    }

    // Creating at least 5 transactions (3 deposits, 2 withdrawals)
    logOutput("--- Initializing Account Operations ---");
    logOutput(myAccount.deposit(200));   // Deposit 1
    logOutput(myAccount.deposit(150));   // Deposit 2
    logOutput(myAccount.withdraw(50));   // Withdrawal 1
    logOutput(myAccount.withdraw(30));   // Withdrawal 2
    logOutput(myAccount.deposit(80));    // Deposit 3

    // Checking final balances and logs
    logOutput("\n--- Account Summaries ---");
    logOutput(myAccount.checkBalance());
    logOutput(myAccount.listAllDeposits());
    logOutput(myAccount.listAllWithdrawals());

    // Logging extra tests to show error handling
    logOutput("\n--- Testing Constraints ---");
    logOutput(myAccount.deposit(-10));   // Fails constraint test
    logOutput(myAccount.withdraw(1000)); // Fails constraint test

</script>
</body>

</html>
